<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Pulse / Biometric ECG line -->
  <path d="M 8 36 L 20 36 L 25 24 L 32 44 L 39 20 L 44 36 L 56 36" 
        fill="none" 
        stroke="url(#grad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
  
  <!-- Metric Core Center Beacon -->
  <circle cx="39" cy="20" r="3" fill="#34d399" />
  <circle cx="32" cy="44" r="2.5" fill="#10b981" />
</svg>
